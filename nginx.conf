server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;

    # nginx's default mime.types has no .mjs: browsers refuse to import ES modules served as
    # application/octet-stream (breaks onnxruntime-web used by the voice VAD). Keep the defaults and add these.
    include /etc/nginx/mime.types;
    types {
        text/javascript mjs;
        application/octet-stream onnx;
        application/wasm wasm;
    }

    # Docker embedded DNS; lets nginx boot without the backend running.
    # Short TTL: when the backend container is recreated its IP changes; a stale IP would make
    # nginx wait the full connect timeout on a dead address.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $backend http://backend:8000;
    # Fail fast (502) instead of hanging ~60 s when the backend is restarting.
    proxy_connect_timeout 3s;

    # With a variable in proxy_pass and no URI part, the original request URI
    # is forwarded unchanged (/api/x -> /api/x).
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    location /ws/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Voice runtime assets (VAD model, onnxruntime wasm/mjs): not content-hashed, so always revalidate.
    location /vad/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
