<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>TRAMA</title>
    <script>
      // Apply the theme before first paint (same rule as src/app/theme.tsx).
      (function () {
        var t = null
        try { t = localStorage.getItem('trama-theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          try { t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark' } catch (e) { t = 'dark' }
        }
        document.documentElement.setAttribute('data-theme', t)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
